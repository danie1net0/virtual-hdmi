<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Monitor virtual</title>
  <desc id="description">O nome Monitor virtual ao lado de um monitor em pixel art, sobre fundo grafite.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D232A"/>
      <stop offset=".6" stop-color="#242B33"/>
      <stop offset="1" stop-color="#2A2F38"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7FE3F5"/>
      <stop offset="1" stop-color="#2F9CC4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 240 -330 0 250 180)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54C8E8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#54C8E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCoral" cx="0" cy="0" r="1" gradientTransform="matrix(0 220 -300 0 1080 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DD5E53" stop-opacity=".18"/>
      <stop offset="1" stop-color="#DD5E53" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" stroke="#FFFFFF" stroke-opacity=".04"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="360" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
    <rect width="1200" height="360" fill="url(#glowCoral)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="27.5" stroke="#FFFFFF" stroke-opacity=".1"/>

