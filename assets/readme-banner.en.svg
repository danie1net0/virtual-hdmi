<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Virtual Monitor</title>
  <desc id="description">The name Virtual Monitor next to an HDMI connector projecting a dashed ultrawide screen, on a graphite background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D232A"/>
      <stop offset=".6" stop-color="#242B33"/>
      <stop offset="1" stop-color="#2A2F38"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7FE3F5"/>
      <stop offset="1" stop-color="#2F9CC4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 240 -330 0 300 150)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54C8E8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#54C8E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCoral" cx="0" cy="0" r="1" gradientTransform="matrix(0 220 -300 0 1080 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DD5E53" stop-opacity=".18"/>
      <stop offset="1" stop-color="#DD5E53" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" stroke="#FFFFFF" stroke-opacity=".04"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="360" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
    <rect width="1200" height="360" fill="url(#glowCoral)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="27.5" stroke="#FFFFFF" stroke-opacity=".1"/>

  <!-- Tela ultrawide projetada (tracejada) -->
  <g transform="translate(70 70)">
    <rect x="0" y="0" width="360" height="154" rx="10" fill="url(#screen)" fill-opacity=".16" stroke="#DD5E53" stroke-width="3" stroke-dasharray="14 9"/>
    <rect x="22" y="22" width="316" height="110" rx="4" fill="url(#screen)" fill-opacity=".85"/>
    <path d="M22 108l60-40 46 28 58-52 70 46 82-36v86H22z" fill="#0F3B50" fill-opacity=".55"/>
  </g>

  <!-- Conector HDMI -->
  <g transform="translate(184 262)">
    <path d="M0 0h132v22l-12 18H12L0 22z" fill="#F1ECE0"/>
    <path d="M12 8h108v12l-8 12H20l-8-12z" fill="#2B323B"/>
    <rect x="26" y="14" width="80" height="6" rx="2" fill="#F1ECE0" fill-opacity=".5"/>
    <circle cx="66" cy="-14" r="6" fill="#DD5E53"/>
    <path d="M66 -8v8" stroke="#DD5E53" stroke-width="3"/>
  </g>

  <!-- Texto -->
  <g transform="translate(520 0)">
    <text x="0" y="150" fill="#F1ECE0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1">Virtual Monitor</text>
    <text x="2" y="196" fill="#C9D3DC" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21">An ultrawide HDMI display for machines with no display.</text>
    <g transform="translate(0 232)">
      <rect width="470" height="38" rx="19" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".14"/>
      <circle cx="24" cy="19" r="5" fill="#54C8E8"/>
      <text x="42" y="24.5" fill="#DCE8F7" font-family="ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing=".3">3440×1440 · 2560×1080 · EDID in the kernel</text>
    </g>
  </g>
</svg>
