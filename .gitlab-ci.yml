# Tests on the oldest and newest supported Python, plus coverage (100% required).
# Every job runs on the aurisbook Mac runner (shell executor), so none spends GitLab CI minutes;
# uv provides the Python of each job.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test

.mac:
  stage: test
  tags:
    - aurisbook-mac
  before_script:
    - uv venv --quiet --python "$PYTHON" "$CI_PROJECT_DIR/.venv"

# The macOS bash 3.2 and BSD tools; tests/run.sh calls python3 and bash from PATH.
test:
  extends: .mac
  parallel:
    matrix:
      - PYTHON: ["3.9", "3.13"]
  script:
    - export PATH="$CI_PROJECT_DIR/.venv/bin:/bin:/usr/bin:$PATH"
    - python3 --version
    - bash --version | head -n 1
    - bash tests/run.sh

# Shell coverage needs bash 4.1+, from Homebrew.
coverage:
  extends: .mac
  variables:
    PYTHON: "3.13"
  script:
    - |
      if [[ ! -x /opt/homebrew/bin/bash ]]; then
        echo "Shell coverage needs bash 4.1+: run brew install bash on the runner."
        exit 1
      fi
    - export PATH="$CI_PROJECT_DIR/.venv/bin:/opt/homebrew/bin:$PATH"
    - uv pip install --quiet --python "$CI_PROJECT_DIR/.venv/bin/python" coverage
    - bash --version | head -n 1
    - bash tests/coverage.sh
  coverage: '/^TOTAL\s.*\s(\d+(?:\.\d+)?)%$/'
