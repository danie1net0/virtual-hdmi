# Tests on the oldest and newest supported Python, plus coverage (100% required).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test

test:
  stage: test
  image: python:${PYTHON}-slim
  parallel:
    matrix:
      - PYTHON: ["3.10", "3.13"]
  script:
    - bash tests/run.sh

# The macOS bash 3.2 and BSD tools, on the aurisbook Mac runner (shell executor).
macos:
  stage: test
  tags:
    - aurisbook-mac
  script:
    # tests/run.sh calls bash from PATH; keep the system 3.2 ahead of Homebrew's.
    - export PATH="/bin:/usr/bin:$PATH"
    - bash --version | head -n 1
    - python3 --version
    - bash tests/run.sh

coverage:
  stage: test
  image: python:3.13-slim
  script:
    # Shell coverage reads PS4 from the environment, which bash ignores as root.
    - useradd --create-home ci
    - chown -R ci "$CI_PROJECT_DIR"
    - su ci -c 'pip install --quiet --user coverage && bash tests/coverage.sh'
  coverage: '/^TOTAL\s.*\s(\d+(?:\.\d+)?)%$/'
