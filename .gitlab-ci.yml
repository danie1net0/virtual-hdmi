# Tests on the oldest and newest supported Python, on Linux (bash 5, GNU) and on macOS (bash 3.2,
# BSD tools), plus coverage (100% required). Linux jobs run on the webmaker-runner Docker runner;
# the macOS job runs in a fresh Tart VM on the Mac (thrown away after the job), where uv provides
# the Python. No job spends GitLab CI minutes.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test

.mac:
  stage: test
  image: ghcr.io/cirruslabs/macos-tahoe-base:latest
  tags: [macos-vm]
  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | env UV_NO_MODIFY_PATH=1 sh
    - export PATH="$HOME/.local/bin:$PATH"
    - uv venv --quiet --python "$PYTHON" "$CI_PROJECT_DIR/.venv"

# The macOS bash 3.2 and BSD tools; tests/run.sh calls python3 and bash from PATH.
test:macos:
  extends: .mac
  parallel:
    matrix:
      - PYTHON: ["3.9", "3.13"]
  script:
    - export PATH="$CI_PROJECT_DIR/.venv/bin:/bin:/usr/bin:$PATH"
    - python3 --version
    - bash --version | head -n 1
    - bash tests/run.sh

# The shell scripts expect a regular user, as on a real machine, so the Linux jobs drop root.
.linux:
  stage: test
  image: python:$PYTHON-slim
  tags: [docker]
  before_script:
    - useradd --create-home tester
    - chown -R tester "$CI_PROJECT_DIR"

test:linux:
  extends: .linux
  parallel:
    matrix:
      - PYTHON: ["3.9", "3.13"]
  script:
    - su tester -c 'python3 --version && bash --version | head -n 1 && bash tests/run.sh'

# Shell coverage needs bash 4.1+, so it runs on Linux.
coverage:
  extends: .linux
  variables:
    PYTHON: "3.13"
  script:
    - su tester -c 'pip install --quiet --user coverage && bash tests/coverage.sh'
  coverage: '/^TOTAL\s.*\s(\d+(?:\.\d+)?)%$/'
